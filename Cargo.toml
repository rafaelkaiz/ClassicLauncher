[package]
name = "classic-launcher"
version = "1.0.0-beta.2"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A fast launcher for openOMSI"

[dependencies]
eframe = "0.37.0"
serde_json = "1"
egui_extras = { version = "0.37.0", features = ["all_loaders"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "bmp"] }
windows = { version = "0.62", features = ["Win32_Devices_HumanInterfaceDevice", "Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_Globalization", "Win32_Media_Multimedia", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input", "Win32_Devices_HumanInterfaceDevice", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO"] }

[build-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
winresource = "0.1.34"
